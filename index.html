<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Compas Parrilleros</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            background-color: #000000;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-bottom: 1px solid #333333;
        }
        nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #00bcd4;
        }
        nav a i {
            font-size: 18px;
            color: #ffffff;
        }
        .logo-img {
            max-width: 200px;
            height: auto;
            border-radius: 50%;
        }
        main {
            width: 100%;
            max-width: 420px;
            padding: 40px 20px;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #ffffff;
            text-align: center;
            white-space: nowrap;
            line-height: 1.1;
        }
        .maps-subtitle {
            font-size: 16px;
            color: #cccccc;
            margin-bottom: 20px;
            display: block; 
            margin-top: 10px;
            text-align: center;
        }
        .img-container {
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }
        .maps-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: block;
        }
        .maps-img:hover {
            transform: scale(1.02);
        }

        /* Ajustes para versión móvil */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }
            .logo-img {
                max-width: 200px;
            }
            nav {
                justify-content: center;
                width: 100%;
                flex-wrap: wrap;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<header>
    <div>
        <a href="#">
            <img src="LCP_LOGO.png" alt="Logo Los Compas Parrilleros" class="logo-img">
        </a>
    </div>
    <nav>
        <a href="LCP_PCT.html">
            <i class="fas fa-credit-card"></i> Pago con<br>
            Transferencia
        </a>
        <a href="https://wa.me/5620904602" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
        <a href="#" target="_blank" rel="noopener noreferrer">
            <i class="fas fa-utensils"></i> Menú
        </a>
        <a href="#" onclick="return false;">
            <i class="fab fa-facebook"></i> Facebook
        </a>
    </nav>
</header>

<main>
    <h1>Los Compas Parrilleros</h1>

    <div class="img-container">
        <a href="https://search.google.com/local/writereview?placeid=ChIJvUt2EgD10YURsaUNcdISHxg" rel="noopener noreferrer">
            <img src="LCP_GOOGLE.jpg" alt="Califícanos en Google Maps" class="maps-img">
        </a>
    </div>
    <div class="maps-subtitle">Haz clic en la imagen</div>
</main>

</body>
</html>
