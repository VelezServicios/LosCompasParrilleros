<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Compas Parrilleros</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            background-color: #000000;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-bottom: 1px solid #333333;
        }
        nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
        }
        /* Centrado específico para el botón de Pago con Transferencia */
        nav a.transfer-btn {
            text-align: center;
        }
        nav a:hover {
            color: #00bcd4;
        }
        nav a i {
            font-size: 18px;
            color: #ffffff;
        }
        .logo-img {
            max-width: 200px;
            height: auto;
            border-radius: 50%;
        }
        main {
            width: 100%;
            max-width: 1000px;
            padding: 40px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #ffffff;
            text-align: center;
            white-space: nowrap;
            line-height: 1.1;
        }

        /* Contenedor principal para la versión de Escritorio (Lado a Lado) */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            width: 100%;
            align-items: start;
            justify-items: center;
        }

        .section-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
        }

        .maps-subtitle {
            font-size: 16px;
            color: #cccccc;
            margin-bottom: 20px;
            display: block; 
            margin-top: 10px;
            text-align: center;
        }
        .img-container {
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }
        .maps-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: block;
        }
        .maps-img:hover {
            transform: scale(1.02);
        }

        /* Estilos para el mapa incrustado */
        .map-container {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333333;
            margin-top: 10px;
        }
        .map-container iframe {
            width: 100%;
            height: 300px;
            border: 0;
            display: block;
        }

        /* Ajustes para versión móvil (Apilado vertical) */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }
            .logo-img {
                max-width: 200px;
            }
            nav {
                justify-content: center;
                width: 100%;
                flex-wrap: wrap;
            }
            h1 {
                font-size: 24px;
                white-space: normal;
            }
            .content-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }
    </style>
</head>
<body>

<header>
    <div>
        <a href="#">
            <img src="LCP_LOGO.png" alt="Logo Los Compas Parrileros" class="logo-img">
        </a>
    </div>
    <nav>
        <a href="LCP_PCT.html" class="transfer-btn">
            <i class="fas fa-credit-card"></i> Pago con<br>
            Transferencia
        </a>
        <a href="https://wa.me/5620904602" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
        <a href="#" target="_blank" rel="noopener noreferrer">
            <i class="fas fa-utensils"></i> Menú
        </a>
        <a href="#" onclick="return false;">
            <i class="fab fa-facebook"></i> Facebook
        </a>
    </nav>
</header>

<main>
    <h1>Los Compas Parrileros</h1>

    <div class="content-grid">
        <!-- Columna Izquierda: Califícanos en Google Maps -->
        <div class="section-box">
            <div class="img-container">
                <a href="https://search.google.com/local/writereview?placeid=ChIJvUt2EgD10YURsaUNcdISHxg" rel="noopener noreferrer">
                    <img src="LCP_GOOGLE.jpg" alt="Califícanos en Google Maps" class="maps-img">
                </a>
            </div>
            <div class="maps-subtitle">Haz clic en la imagen</div>
        </div>

        <!-- Columna Derecha: ¿Cómo llegar? y Mapa -->
        <div class="section-box">
            <div class="maps-subtitle" style="font-weight: bold; color: #ffffff;">¿Cómo llegar?</div>
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d223.15929013962423!2d-99.10171884629845!3d19.695041087616893!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d1f50012764bbd%3A0x181f12d2710da5b1!2sLOS%20COMPAS%20PARRILLEROS!5e1!3m2!1ses-419!2smx!4v1794097559706!5m2!1ses-419!2smx" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </div>
    </div>
</main>

</body>
</html>
